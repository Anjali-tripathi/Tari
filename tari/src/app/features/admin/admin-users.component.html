<h2 class="page-title">User Management</h2>

<mat-form-field class="search-field">
  <mat-label>Search users...</mat-label>
  <input matInput (keyup)="applyFilter($event)">
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div class="table-container mat-elevation-z2">
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let u">
        <div class="user-cell">
          <div class="user-avatar">{{ u.name.charAt(0) | uppercase }}</div>
          <span>{{ u.name }}</span>
        </div>
      </td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let u">{{ u.phone }}</td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let u">
        <span class="chip" [class.chip-confirmed]="u.role === 'user'" [class.chip-on_the_way]="u.role === 'admin'">{{ u.role | titlecase }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="joined">
      <th mat-header-cell *matHeaderCellDef>Joined</th>
      <td mat-cell *matCellDef="let u">{{ u.createdAt | date:'mediumDate' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
</div>
