<div class="page-container">
  <div class="profile-header card">
    <div class="avatar">{{ user?.name?.charAt(0) | uppercase }}</div>
    <div>
      <h2>{{ user?.name }}</h2>
      <p class="text-muted">{{ user?.email }}</p>
      <p class="text-muted">{{ user?.phone }}</p>
    </div>
  </div>
  <nav mat-tab-nav-bar class="mt-2">
    <a mat-tab-link routerLink="orders" routerLinkActive #rla1="routerLinkActive" [active]="rla1.isActive">My Orders</a>
    <a mat-tab-link routerLink="addresses" routerLinkActive #rla2="routerLinkActive" [active]="rla2.isActive">Addresses</a>
  </nav>
  <router-outlet></router-outlet>
</div>
